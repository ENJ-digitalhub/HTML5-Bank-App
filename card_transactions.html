<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card | Transactions</title>
    <link rel="stylesheet" href="/css/root.css">
    <link rel="stylesheet" href="/css/card_transactions.css">
    <link rel="shortcut icon" href="/media/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_outward" />
</head>

<body>
    <main>
        <div class="return">
            <a href="/card.html">
                <button>
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </a>
        </div>
        <header>
            <h1>Transactions</h1>
        </header>
        <section class="features">
            <div>
                <input type="text" placeholder="Search" id="js-searchInput">
                <button id="js-searchBtn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <div>
                <select name="filter" id="js-filter">
                    <option value="all">All Status</option>
                    <option value="successful">Successful</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                    <option value="scheduled">Scheduled</option>
                    <option value="reserved">Reserved</option>
                </select>
            </div>
        </section>
        <section class="container">
            <div class="notFound deactivate">
                <div>
                    <p>Not Found ...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/card_transactions.js"></script>
</body>

</html>
